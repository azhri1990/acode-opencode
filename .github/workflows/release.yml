name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: node esbuild.config.mjs

      - name: Validate the package
        run: npm run validate-package

      - name: Attach the plugin package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
